
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disable Kotlin incremental compilation to fix cross-drive (C: vs D:) path errors on Windows
kotlin.incremental=false

# Force IPv4 to fix mobile hotspot timeouts
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
android.injected.checkAarMetadata=false
kotlin.jvm.target.validation.mode=warning